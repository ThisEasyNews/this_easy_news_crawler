name: Daily Briefing Batch

on:
  workflow_run:
    workflows: ["News Summarize Batch"]
    types: [completed]
  workflow_dispatch:

jobs:
  briefing:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate Briefing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -c "from app.core.database import SessionLocal; from app.services.briefing import create_daily_briefing; import asyncio; db=SessionLocal(); asyncio.run(create_daily_briefing(db)); db.close()"