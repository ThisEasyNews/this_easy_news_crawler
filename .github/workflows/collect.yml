name: News Collect Batch

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # KST 09, 15, 21, 03
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Collection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -c "from app.services.collector import run_all_categories; import asyncio; asyncio.run(run_all_categories())"