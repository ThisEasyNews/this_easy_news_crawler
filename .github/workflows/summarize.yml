name: News Summarize Batch

on:
  workflow_run:
    workflows: ["News Collect Batch"]
    types: [completed]
  workflow_dispatch:

jobs:
  summarize:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Recursive Summary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python -c "
          import asyncio, time
          from app.core.database import SessionLocal
          from app.services.processor import process_news_summaries

          async def run_loop():
              while True:
                  db = SessionLocal()
                  processed_count = 0 # 처리 결과 저장용 변수
                  try:
                      print('\n🚀 [Batch] 160개 병렬 요약 세션을 시작합니다...')
                      # 함수로부터 처리된 카테고리(혹은 기사) 수를 전달받음
                      processed_count = await process_news_summaries(db, limit=20)
                      
                      # 💡 만약 반환값이 0(또는 None)이라면 더 이상 할 일이 없다는 뜻
                      if not processed_count or processed_count == 0:
                          print('✨ 모든 요약 작업이 완료되었습니다. 배치를 종료합니다.')
                          break 

                  except Exception as e:
                      print(f'❌ 에러 발생: {e}')
                      break 
                  finally:
                      db.close()
                  
                  # 여기까지 왔다면 할 일이 더 남았다는 뜻이므로 휴식 후 다시 루프
                  print(f'⏳ {processed_count}개 세션 완료. 60초 대기 후 다음 묶음 시작...')
                  time.sleep(60)
          
          asyncio.run(run_loop())
          "